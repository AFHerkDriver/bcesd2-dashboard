<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BC2FD MDT</title>
<!-- Link-preview card (iOS Messages, etc.) — same rules as the board's: URLs absolute,
     og:image 1200x630 JPEG, the size every platform renders large. -->
<meta property="og:type" content="website">

<meta property="og:url" content="https://afherkdriver.github.io/bcesd2-dashboard/mdt.html">

<link rel="icon" href="favicon-32.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  button:active,.btn:active,a.navbtn:active{transform:translateY(1px);filter:brightness(.85)}   /* gentle press feedback — consistent across every BC2FD page */
  /* MDT tier — Windows touchscreen in the cab. One screen, map-dominant, big touch targets.
     If it doesn't change a decision in the next ten minutes, it isn't on this screen. */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #0D1117; color: #E6EDF3; font-family: 'DM Mono', monospace; }
  button { font-family: 'DM Mono', monospace; cursor: pointer; }
  #map { position: fixed; inset: 0; background: #0D1117; }
  .leaflet-container { background: #0D1117; font-family: 'DM Mono', monospace; }
  .call-pin{filter:drop-shadow(0 0 3px rgba(0,0,0,.85))}   /* keeps a pin legible over bright satellite imagery — same halo as the wall */
  /* fresh call: pulse + sonar double-ripple — the wall's treatment, in the cab. FINITE iteration
     counts (~60 s, matching the one-time map focus) so nothing ripples all shift if a cleanup
     timer is missed. Rings take the call-type color via --sonar, set inline. */
  @keyframes pinflash{0%{opacity:1}25%{opacity:.4}60%,100%{opacity:1}}
  .call-pin.pin-new{animation:pinflash 1s ease-out 60}
  .pin-sonar-wrap{background:transparent;border:0}
  .pin-sonar{position:relative;width:0;height:0;pointer-events:none}
  .pin-sonar span{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;
    border-radius:50%;border:2px solid var(--sonar,#FFFFFF);opacity:0;
    box-shadow:0 0 4px rgba(0,0,0,.85);animation:pinsonar 2s ease-out 30}
  .pin-sonar span:nth-child(2){animation-delay:1s}
  @keyframes pinsonar{0%{transform:scale(.45);opacity:.9}70%{opacity:.22}100%{transform:scale(4.4);opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .call-pin.pin-new{animation:none}
    .pin-sonar span{animation:none;display:none}
  }
  /* hydrant detail popup — dark chrome to match the page */
  .leaflet-popup-content-wrapper{background:rgba(13,17,23,.96);color:#E6EDF3;border:1px solid #30363D;
    border-radius:10px;font-family:'DM Mono',monospace;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .leaflet-popup-content{margin:10px 14px;font-size:12px;line-height:1.55}
  .leaflet-popup-tip{background:rgba(13,17,23,.96)}
  a.leaflet-popup-close-button{color:#8B949E}
  .hyd-pop b{color:#58A6FF;font-weight:500}
  .hyd-pop .hp-sz{color:#FFC107}
  .hyd-pop .hp-oos{color:#F85149;font-weight:500}
  /* parcel house-number labels (close zoom) — context under the pins, never competition */
  .addr-lbl-wrap{background:none;border:0}
  .addr-lbl{position:absolute;transform:translate(-50%,-50%);font-family:'DM Mono',monospace;font-size:10px;
    line-height:1;color:#C9D1D9;opacity:.85;white-space:nowrap;pointer-events:none;
    text-shadow:0 0 3px #000,0 0 3px #000,0 1px 2px #000}

  /* top band — one flex row over the map: call cards on the left, status chips pinned right.
     Sharing the row is what makes card/chip overlap structurally impossible. */
  #callBandWrap { position: fixed; top: 0; left: 0; right: 0; z-index: 800; display: flex; gap: 8px;
                  padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
                           8px max(8px, env(safe-area-inset-left));   /* iPhone Dynamic Island / notch: cards step around the camera housing (env()=0 everywhere else) */
                  pointer-events: none; align-items: flex-start; }
  #callBand { display: flex; gap: 8px; flex: 1 1 auto; min-width: 0; pointer-events: none; }
  .ccard { pointer-events: auto; flex: 0 1 auto; min-width: 0; max-width: 640px; background: rgba(13,17,23,.94);   /* auto-size: basis comes from the card's own content, capped at 640 — a short call must not drag a wall of empty card across the map. min-width:0 still lets cards compress instead of overflowing under the chips */
           border: 2px solid #F85149; border-radius: 12px; padding: 10px 14px; cursor: pointer; }
  .ccard:active { background: rgba(28,34,48,.96); }
  .ccard .ty { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; color: #F85149; line-height: 1.05; }
  .ccard .ad { font-size: 17px; color: #E6EDF3; margin-top: 2px; font-weight: 500; }
  .ccard .meta { font-size: 12px; color: #8B949E; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .ccard .meta b { color: #FFC107; font-weight: 500; }
  .ccard .uline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
  .ccard .uline b { color: #FFC107; font-weight: 500; margin-right: 4px; }
  .ccard .utag { border: 1px solid #8B949E; border-radius: 6px; padding: 1px 9px; color: #E6EDF3; font-size: 13px; }
  .ccard .utag.app { border-color: #3FB950; color: #3FB950; background: rgba(63,185,80,.12); font-weight: 500; }
  .ccard.slim { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; }
  .ccard.slim .sty { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1px; white-space: nowrap; }
  .ccard.slim .sad { font-size: 13px; color: #E6EDF3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ccard.slim .stime { font-size: 11px; color: #8B949E; white-space: nowrap; margin-left: auto; }
  .ccard .navbtn { margin-top: 8px; display: inline-flex; align-items: center; gap: 7px; background: #1C2230;
                   color: #3FB950; border: 1px solid #3FB950; text-decoration: none;
                   height: 38px; vertical-align: top; line-height: 1;   /* fixed height + top align: the Apple glyph's font metrics can't skew the pair */
                   border-radius: 8px; padding: 0 16px; font-size: 14px; font-weight: 500; }
  .ccard .navbtn.apple { background: #1C2230; border: 1px solid #58A6FF; color: #58A6FF; }
  /* tender water-supply chip — red solid = fire call in a hydrant gap; amber dashed = alarm call
     in a gap (tenders if it turns into a working fire). Same rules as the wall's call rows. */
  .ccard .tdops { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 6px;
                  font-size: 12.5px; font-weight: 500; letter-spacing: .5px;
                  border: 1px solid #F85149; color: #F85149; background: rgba(248,81,73,.12); }
  .ccard .tdops.if { border: 1px dashed #FFC107; color: #FFC107; background: rgba(255,193,7,.10); }
  .gbadge { display: inline-flex; align-items: center; }
  #noCalls { pointer-events: none; background: rgba(13,17,23,.85); border: 1px solid #30363D; border-radius: 10px;
             padding: 8px 14px; font-size: 13px; color: #3FB950; align-self: flex-start; }

  /* right rail chips — LIVE INSIDE the call band's flex row (margin-left:auto), so call cards and
     the facilities/weather chips can never overlap: the cards shrink, the chips keep their corner */
  #rail { margin-left: auto; pointer-events: auto; display: flex; flex-direction: column; gap: 6px;
          align-items: flex-end; max-width: 34vw; flex: 0 0 auto; }
  .chip { background: rgba(13,17,23,.94); border: 1px solid #30363D; border-radius: 10px; padding: 7px 12px;
          font-size: 12px; color: #8B949E; text-align: right; }
  .chip.ok { color: #3FB950; border-color: rgba(63,185,80,.5); }
  .chip.bad { color: #F85149; border-color: #F85149; font-weight: 500; }
  .chip.warn { color: #FFC107; border-color: rgba(255,193,7,.6); font-weight: 500; }
  .chip .sub { display: block; font-size: 10px; color: #8B949E; font-weight: 400; }

  /* drone PiP — three sizes: corner, half screen, full screen (tap ⤢ to cycle) */
  #dronePip { position: fixed; right: max(8px, env(safe-area-inset-right)); bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 850; width: min(340px, 40vw); display: none; }   /* clears the bottom-right layers button */
  #dronePip.half { width: min(50vw, 720px); }
  #dronePip.full { left: 0; top: 0; right: 0; bottom: 0; width: auto; z-index: 1500;
                   background: rgba(13,17,23,.97); display: flex; align-items: center; justify-content: center; }
  #dronePip.full video { height: 100vh; width: 100vw; object-fit: contain; border: none; border-radius: 0; }
  #dronePip video { width: 100%; border-radius: 10px; border: 2px solid #FF6B35; background: #000; display: block; }
  #dronePip .lbl { position: absolute; top: 6px; left: 8px; font-size: 11px; color: #FF6B35; font-weight: 500;
                   text-shadow: 0 0 4px #000, 0 0 4px #000; z-index: 5; }
  #pipSize { position: absolute; top: 4px; right: 6px; z-index: 6; background: rgba(13,17,23,.85);
             border: 1px solid #FF6B35; color: #FF6B35; border-radius: 8px; padding: 8px 14px; font-size: 15px; }

  /* bottom-left controls */
  #ctrls { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); z-index: 800; display: flex; gap: 8px; }
  #ctrls button { background: rgba(13,17,23,.94); border: 1px solid #30363D; color: #E6EDF3; border-radius: 10px;
                  padding: 12px 16px; font-size: 15px; }
  #ctrls button:active { border-color: #FF6B35; color: #FF6B35; }

  /* phone tier — the same screen, sized for a pocket: chips become a slim top row, call cards
     stack full-width (two calls read as a list, not a squeeze), buttons compact but still thumbable */
  @media (max-width: 640px) {
    #callBandWrap { flex-direction: column-reverse; align-items: stretch; gap: 6px; }
    #callBandWrap:has(#noCalls) { flex-direction: row; align-items: flex-start; }   /* idle: NO ACTIVE CALLS and the facilities chip share one row */
    #callBandWrap:has(#noCalls) #rail { flex-direction: column; margin-left: auto; }
    #rail { flex-direction: row; justify-content: flex-end; max-width: none; margin-left: 0; }
    #callBand { flex-direction: column; }
    .ccard { max-width: none; }
    .ccard .ty { font-size: 21px; }
    .ccard .ad { font-size: 15px; }
    .ccard .meta { font-size: 11px; }
    .ccard .navbtn { height: 40px; min-width: 52px; justify-content: center; padding: 0; font-size: 13px; margin-top: 6px; }
    .ccard .navbtn .btxt { display: none; }               /* phone: logo only — the border color says which app */
    .ccard .navbtn svg { width: 19px; height: 19px; }
    .ccard .navbtn .alogo { font-size: 19px; }
    .chip { font-size: 10px; padding: 5px 9px; }
    #dronePip { width: 58vw; }
    #ctrls button { padding: 10px 13px; font-size: 13px; }
  }

  /* layers control — Leaflet ships it white; restyle to the page's dark chrome */
  .leaflet-control-layers { background: rgba(13,17,23,.94); border: 1px solid #30363D; border-radius: 10px;
                            color: #E6EDF3; box-shadow: none; }
  .leaflet-control-layers-toggle { filter: invert(1); }   /* stock glyph is dark-on-transparent — inverted it reads on the dark chip */
  .leaflet-control-layers-expanded { padding: 8px 12px; font-size: 13px; }
  .leaflet-control-layers label { margin-bottom: 2px; }
  .leaflet-control-layers input { accent-color: #FF6B35; }
  .leaflet-control-layers-separator { border-top-color: #30363D; }

  /* feed-down banner — fail LOUD */
  #feedDown { position: fixed; top: 0; left: 0; right: 0; z-index: 1200; display: none; background: #F85149;
              color: #0D1117; font-weight: 700; text-align: center; letter-spacing: 1px; font-size: 15px;
              padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left)); }
  /* leaflet corner controls (layers, attribution) step around the home indicator / island too */
  .leaflet-bottom.leaflet-right { margin-right: env(safe-area-inset-right); margin-bottom: env(safe-area-inset-bottom); }

  /* PIN gate */
  #gate { position: fixed; inset: 0; background: #0D1117; z-index: 2000; display: flex; align-items: center; justify-content: center; }
  .gatebox { width: min(340px, 88vw); background: #161B22; border: 1px solid #30363D; border-radius: 12px; padding: 28px 22px; text-align: center; }
  .gatebox h1 { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px; }
  .gatebox h1 b { color: #FF6B35; font-weight: 400; }
  .gatebox .s { font-size: 11px; color: #8B949E; margin-bottom: 18px; }
  .gatebox input { width: 100%; background: #0D1117; border: 1px solid #30363D; color: #E6EDF3; border-radius: 8px;
                   padding: 14px; font-size: 22px; text-align: center; letter-spacing: 8px; outline: none; }
  .gatebox input:focus { border-color: #FF6B35; }
  .gatebox button { width: 100%; margin-top: 12px; background: #FF6B35; border: none; color: #0D1117; font-weight: 500;
                    border-radius: 8px; padding: 14px; font-size: 16px; letter-spacing: 1px; }
  .gatebox .gerr { color: #F85149; font-size: 12px; margin-top: 10px; min-height: 15px; }
</style>
</head>
<body>

<div id="gate">
  <div class="gatebox">
    <h1>BC2FD <b>MDT</b></h1>
    <div class="s">MOBILE DATA TERMINAL &middot; STATION PIN</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" maxlength="8">
    <button id="go">Unlock</button>
    <div class="gerr" id="gerr"></div>
  </div>
</div>

<div id="feedDown">DISPATCH FEED DOWN — RELY ON RADIO</div>
<div id="map"></div>
<div id="callBandWrap">
  <div id="callBand"></div>
  <div id="rail">
    <div class="chip" id="hospChip" style="display:none">hospitals &hellip;</div>
    <div class="chip" id="wxChip" style="display:none"></div>
  </div>
</div>
<div id="dronePip"><span class="lbl" id="droneLbl"></span><button id="pipSize" title="Resize">&#10530;</button><video id="droneVid" muted autoplay playsinline controls></video></div>
<div id="ctrls">
  <button id="refit" title="Frame the district">&#8982; District</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(() => {
  const WORKER = "https://bc2fd-dash-auth.usafsentinel-45e.workers.dev";
  const STATE_DOC = "https://firestore.googleapis.com/v1/projects/firehawk-scheduler/databases/(default)/documents/firehawk/dashboard_state?key=AIzaSyAWbzE0k8p4WDyrUaBfIRDqyLoklkfu8nQ";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* ── PIN gate — station PIN, verified against /dispatch (the feed this screen lives on) ── */
  let PIN = sessionStorage.getItem("mdtPin") || "";
  function showGate(msg) { $("gate").style.display = "flex"; $("gerr").textContent = msg || ""; sessionStorage.removeItem("mdtPin"); }
  async function unlock() {
    const p = $("pin").value.trim();
    if (!/^\d{4,8}$/.test(p)) { $("gerr").textContent = "Enter the station PIN"; return; }
    $("gerr").textContent = "checking…";
    try {
      const r = await fetch(WORKER + "/dispatch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: p }) });
      const j = await r.json().catch(() => null);
      if (r.status === 401) { $("gerr").textContent = "PIN not recognized"; return; }
      if (r.status === 429) { $("gerr").textContent = "Too many tries — locked 5 min"; return; }
      if (!j) { $("gerr").textContent = "Feed error — try again"; return; }
      PIN = p; sessionStorage.setItem("mdtPin", p);
      $("gate").style.display = "none";
      boot();
    } catch (e) { $("gerr").textContent = "Worker unreachable — check signal"; }
  }
  $("go").addEventListener("click", unlock);
  $("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });

  /* ── MAP — cab composition of the board's stack: sun-follow imagery, stations, borders,
     hydrants (incl. officer OOS reds), crossing pins, radar in storms. No burn-in orbit, no
     wall-tier logic — this is its own tier. ── */
  let map, callLayer, freshLayer, hydLayer, oosLayer, cxLayer, addrLayer, tourLayer, radarOn = false;
  const TL = (u, o) => { o = o || {}; o.updateWhenIdle = true; o.updateWhenZooming = false; o.keepBuffer = 4; return L.tileLayer(u, o); };
  function sunUp() { const lat = 29.465, lng = -98.73, now = new Date(), rad = Math.PI / 180, deg = 180 / Math.PI;
    const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
    const utcH = now.getUTCHours() + now.getUTCMinutes() / 60;
    const decl = -23.44 * Math.cos(rad * 360 / 365 * (doy + 10));
    const B = rad * 360 / 365 * (doy - 81), eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    const H = 15 * ((utcH + lng / 15 + eot / 60) - 12);
    return deg * Math.asin(Math.sin(rad * lat) * Math.sin(rad * decl) + Math.cos(rad * lat) * Math.cos(rad * decl) * Math.cos(rad * H)) > -0.833; }
  const IDLE_PTS = [[29.454183,-98.755111],[29.505141,-98.782267],[29.405115,-98.701876],[29.413373,-98.785885],[29.49202,-98.74346]];
  const SOUTH_PTS = [[29.21967,-98.45806],[29.17785,-98.42410]];   /* 161 + 162 — ESD 6 frame */
  function districtView() { try { map.fitBounds(IDLE_PTS, { padding: [40, 40], maxZoom: 15 }); } catch (e) {} }
  function southView() { try { map.fitBounds(SOUTH_PTS, { padding: [70, 70], maxZoom: 13 }); } catch (e) {} }
  function initMap() {
    const dark = TL("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 20 });
    const positron = TL("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 20 });
    /* hybrid labels are Carto (OSM), not Esri reference tiles: OSM carries new-subdivision streets
       within weeks while World_Transportation lags years — and its halo'd text reads over bright
       imagery. One label source, streets + places both, so nothing double-draws. */
    const satellite = L.layerGroup([
      TL("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
      TL("https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 19 })]);
    map = L.map("map", { center: [29.44, -98.72], zoom: 12, layers: [sunUp() ? satellite : dark], zoomControl: false });
    map.attributionControl.setPrefix(false);
    map.createPane("radarPane"); map.getPane("radarPane").style.zIndex = 350;
    /* layer choices — same set as the wall: bases, Wind Flow particles, radar (manual on top of
       its storm auto-on) */
    const radarOverlay = L.layerGroup(), windOverlay = L.layerGroup(), tenderOverlay = L.layerGroup();
    tourLayer = L.layerGroup();
    L.control.layers({ "Dark": dark, "Positron": positron, "Satellite": satellite },   /* both lists alphabetical — the panel reads as a menu, not an accretion log */
      { "Radar": radarOverlay, "Tender Zones": tenderOverlay, "Tour Calls": tourLayer, "Wind Flow": windOverlay },
      { collapsed: true, position: "bottomright" }).addTo(map);
    /* tour pins live at z-390: over labels/tender, UNDER the live call circles (z-400 overlay pane) —
       a finished run must never sit on top of an active one */
    map.createPane("tourPane"); map.getPane("tourPane").style.zIndex = 390; map.getPane("tourPane").style.pointerEvents = "auto";
    /* TENDER OPS ZONES — the wall's precomputed no-hydrant territory (>1,000 ft from any plug),
       here as an opt-in overlay instead of always-on wash. One polygon per district keeps the SVG
       even-odd fill: covered islands inside a zone stay unshaded. Slightly more ink than the wall's
       ambient .07 — a deliberately toggled layer on a sunlit cab screen has to actually read. */
    map.createPane("tenderPane"); map.getPane("tenderPane").style.zIndex = 370; map.getPane("tenderPane").style.pointerEvents = "none";
    fetch("tender-zones.json").then(r => r.ok ? r.json() : null).then(z => {
      if (!z) return;
      ["esd2", "esd6"].forEach(k => {
        if ((z[k] || []).length) L.polygon(z[k], { pane: "tenderPane", color: "#FF3B30", weight: 1,
          opacity: .35, fillColor: "#FF3B30", fillOpacity: .12, interactive: false }).addTo(tenderOverlay);
      });
    }).catch(() => {});
    map.on("overlayadd", e => { if (e.layer === radarOverlay) { radarManual = true; radarSync(); }
                                if (e.layer === windOverlay) { windManual = true; fetchWindGrid(); wKick(); }
                                if (e.layer === tourLayer) tourLoad(); });
    map.on("overlayremove", e => { if (e.layer === radarOverlay) { radarManual = false; radarSync(); }
                                   if (e.layer === windOverlay) { windManual = false; wKick(); } });
    map.on("move zoom", () => { if (wcv && wctx) wctx.clearRect(0, 0, wcv.width, wcv.height); });
    /* stations + borders */
    [["120",29.392122,-98.709906],["121",29.454183,-98.755111],["122",29.505141,-98.782267],
     ["123",29.405115,-98.701876],["124",29.413373,-98.785885],["125",29.49202,-98.74346],
     ["161",29.21967,-98.45806],["162",29.17785,-98.42410]].forEach(s =>
      L.marker([s[1], s[2]], { icon: L.icon({ iconUrl: "station-" + s[0] + ".png", iconSize: [30, 30], iconAnchor: [15, 15] }),
        interactive: false, keyboard: false, zIndexOffset: -1000 }).addTo(map));
    fetch("district-bounds.json").then(r => r.json()).then(b => {
      ["esd2", "esd6"].forEach(k => (b[k] || []).forEach(ring =>
        L.polygon(ring.map(p => [p[1], p[0]]), { color: "#FF6B35", weight: 1.5, fill: false, opacity: .55 }).addTo(map)));
    }).catch(() => {});
    callLayer = L.layerGroup().addTo(map);
    freshLayer = L.layerGroup().addTo(map);   /* sonar rings — own layer so the per-poll pin rebuild can't restart or orphan them */
    hydLayer = L.layerGroup().addTo(map);
    oosLayer = L.layerGroup().addTo(map);   /* flagged-OOS reds — NOT zoom-gated; a dead plug must be visible from district view */
    cxLayer = L.layerGroup().addTo(map);
    /* address labels live UNDER the call circles: MDT call pins are vectors in the z-400 overlay
       pane (unlike the wall's z-600 divIcon pins), so this pane must sit below 400, above radar */
    map.createPane("addrPane"); map.getPane("addrPane").style.zIndex = 380; map.getPane("addrPane").style.pointerEvents = "none";
    addrLayer = L.layerGroup().addTo(map);
    map.on("moveend zoomend", hydUpdate);
    map.on("moveend zoomend", () => { if (addrDeb) clearTimeout(addrDeb); addrDeb = setTimeout(addrUpdate, 400); });
    districtView();
    /* day/night swap every 5 min */
    let day = sunUp();
    setInterval(() => { const d = sunUp(); if (d !== day) { day = d;
      [satellite, dark].forEach(l => { try { map.removeLayer(l); } catch (e) {} });
      map.addLayer(d ? satellite : dark); } }, 5 * 60 * 1000);
  }
  /* ⌖ toggles between the two districts: first tap frames D2 (121-125), next frames the south
     (161/162), and so on — the label always names where the NEXT tap goes */
  let refitSouth = false;
  $("refit").addEventListener("click", () => {
    if (refitSouth) { southView(); $("refit").innerHTML = "&#8982; District 2"; }
    else { districtView(); $("refit").innerHTML = "&#8982; District 6"; }
    refitSouth = !refitSouth;
  });

  /* ── HYDRANTS — the department's own db (hydrants.json): SAWS master list 2026-01-30 +
     Active911 private hydrants, via the PR Div Chief. Loaded once, filtered locally per view —
     no external GIS on the hot path, and four years fresher than any public layer. Addresses
     joined from the 2022 county export where the plug existed then (officer OOS flags match on
     them); private plugs carry their A911 notes (flow tests, warnings). Zoom-gated like the board. ── */
  let HYDB = null;
  fetch("hydrants.json").then(r => r.ok ? r.json() : null).then(j => {
    if (j && Array.isArray(j.h)) { HYDB = j; hydPainted = ""; try { hydUpdate(); oosRepaint(); } catch (e) {} }
  }).catch(() => {});   /* absent db -> no dots, no tender chips; dispatch banner is the loud one */
  const HYD_Z = 16.2;
  let hydPainted = "", oosHyd = [];
  const hIc = (f, s) => L.icon({ iconUrl: f + ".png", iconRetinaUrl: f + "@2x.png", iconSize: [s, s], iconAnchor: [s / 2, s] });
  const hydIcon = hIc("hydrant-marker", 20), hydIconBig = hIc("hydrant-marker-hv", 26), hydIconOOS = hIc("hydrant-marker-oos", 26);
  /* suffix synonyms canonicalize BEFORE stripping — an officer's "Applewhite Road" must match the
     db's "APPLEWHITE RD"; both sides of every comparison pass through here */
  const hydNorm = (s) => String(s || "").toUpperCase()
    .replace(/\b(ROAD|DRIVE|STREET|LANE|TRAIL|PARKWAY|BOULEVARD|AVENUE|HIGHWAY|CIRCLE|COURT|PLACE|COVE|BEND|CROSSING|EXPRESSWAY)\b/g,
      (m) => ({ ROAD: "RD", DRIVE: "DR", STREET: "ST", LANE: "LN", TRAIL: "TRL", PARKWAY: "PKWY", BOULEVARD: "BLVD",
                AVENUE: "AVE", HIGHWAY: "HWY", CIRCLE: "CIR", COURT: "CT", PLACE: "PL", COVE: "CV", BEND: "BND",
                CROSSING: "XING", EXPRESSWAY: "EXPY" }[m]))
    .replace(/[^A-Z0-9]/g, "");
  const hydIsOOS = (a) => { a = hydNorm(a); return !!a && oosHyd.some(o => o && o.length >= 4 && a.indexOf(o) >= 0); };
  function hydUpdate() {
    if (!map) return;
    if (map.getZoom() < HYD_Z || !HYDB) { hydLayer.clearLayers(); hydPainted = ""; return; }
    const b = map.getBounds().pad(0.12);
    const key = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(x => x.toFixed(4)).join(",");
    if (key === hydPainted) return; hydPainted = key;
    hydLayer.clearLayers();
    const w = b.getWest(), s = b.getSouth(), e = b.getEast(), n = b.getNorth();
    let shown = 0;
    for (const h of HYDB.h) {                      /* [id, main_in, lat, lng, addr|0, private] */
      if (h[3] < w || h[3] > e || h[2] < s || h[2] > n) continue;
      if (h[4] && hydIsOOS(h[4])) continue;        /* flagged reds live in oosLayer — always on, never doubled */
      if (++shown > 400) break;
      const addr = h[4] || "";
      const icon = (h[1] || 0) >= 10 ? hydIconBig : hydIcon;
      L.marker([h[2], h[3]], { icon, keyboard: false, zIndexOffset: -500 })
        .bindPopup('<div class="hyd-pop"><b>HYD ' + esc(h[0]) + '</b>' +
          (h[5] ? ' <span class="hp-oos">PRIVATE</span>' : '') +
          (addr ? '<br>' + esc(addr) : '') +
          '<br><span class="hp-sz">' + ((h[1] || 0) ? h[1] + '&Prime; main' : 'main size unknown') + '</span>' +
          '</div>', { maxWidth: 260 })
        .addTo(hydLayer);
    }
  }
  /* flagged-OOS hydrants render at EVERY zoom — the entire point of an officer flagging a dead
     plug is that crews see it without having to know where to look */
  function oosRepaint() {
    if (!oosLayer) return;
    oosLayer.clearLayers();
    if (!HYDB || !oosHyd.length) return;
    for (const h of HYDB.h) {
      if (!h[4] || !hydIsOOS(h[4])) continue;
      L.marker([h[2], h[3]], { icon: hydIconOOS, keyboard: false })
        .bindPopup('<div class="hyd-pop"><b>HYD ' + esc(h[0]) + '</b> <span class="hp-oos">OUT OF SERVICE</span>' +
          '<br>' + esc(h[4]) +
          '<br><span class="hp-sz">' + ((h[1] || 0) ? h[1] + '&Prime; main' : 'main size unknown') + '</span></div>', { maxWidth: 260 })
        .addTo(oosLayer);
    }
  }

  /* ── ADDRESS LABELS — the CAD map's "every address", same source + rules as the wall: Bexar
     appraisal parcels (Situs) from maps.bexar.org, house numbers past ADDR_Z, client centroids,
     bbox cache. Only Situs is ever requested — owner data never leaves the county server.
     Enhancement layer: county GIS unreachable = labels simply absent. ── */
  const ADDR_URL = "https://maps.bexar.org/arcgis/rest/services/Parcels/MapServer/0/query";
  const ADDR_Z = 16.2, addrCache = {}, addrKeys = [];
  let addrSeq = 0, addrPainted = "", addrDeb = null;
  function addrPaint(feats, key) {
    if (key && key === addrPainted) return;   /* view already painted — rebuilding 300+ DOM labels per pan tick is what made the wall map drag */
    addrPainted = key || "";
    addrLayer.clearLayers();
    feats.slice(0, 350).forEach(f => {
      const g = f.geometry && f.geometry.rings && f.geometry.rings[0]; if (!g || !g.length) return;
      let sx = 0, sy = 0; g.forEach(p => { sx += p[0]; sy += p[1]; });
      const num = (String((f.attributes && f.attributes.Situs) || "").trim().match(/^\d+/) || [""])[0]; if (!num) return;
      L.marker([sy / g.length, sx / g.length], { pane: "addrPane", interactive: false, keyboard: false,
        icon: L.divIcon({ className: "addr-lbl-wrap", html: '<span class="addr-lbl">' + num + "</span>", iconSize: [0, 0] }) }).addTo(addrLayer);
    });
  }
  function addrUpdate() {
    if (!map) return;
    if (map.getZoom() < ADDR_Z) { addrLayer.clearLayers(); addrPainted = ""; return; }
    const b = map.getBounds().pad(0.12);
    const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(x => x.toFixed(4)).join(",");
    if (addrCache[bbox]) { addrPaint(addrCache[bbox], bbox); return; }
    const seq = ++addrSeq;
    fetch(ADDR_URL + "?geometry=" + bbox + "&geometryType=esriGeometryEnvelope&inSR=4326&outSR=4326&spatialRel=esriSpatialRelIntersects&outFields=Situs&returnGeometry=true&geometryPrecision=5&maxAllowableOffset=0.0002&resultRecordCount=800&f=json")
      .then(r => r.ok ? r.json() : null).then(j => {
        if (seq !== addrSeq || !j || !Array.isArray(j.features)) return;   /* stale response or bad reply -> drop */
        addrCache[bbox] = j.features; addrKeys.push(bbox);
        if (addrKeys.length > 40) delete addrCache[addrKeys.shift()];
        if (map.getZoom() >= ADDR_Z) addrPaint(j.features, bbox);
      }).catch(() => {});
  }

  /* ── TOUR CALLS — the wall's pin accumulation as an opt-in overlay: every run of the CURRENT
     tour from the /calls log (worker returns it already folded to incidents), same 0700 AABBCC
     tour window and type palette as the board. Runs without a coordinate simply aren't pinned;
     announcements are not runs. Cached 4 min — toggling off/on re-shows instantly, no refetch. ── */
  const CT_ZONE = "America/Chicago";
  const ctNow = () => { try { return new Date(new Date().toLocaleString("en-US", { timeZone: CT_ZONE })); } catch (e) { return new Date(); } };
  function ctEpoch(y, mo, d, hh, mm) {   /* real epoch for a Central wall-clock time — device zone would mis-slice the tour on any phone outside CT, and this stays right across DST */
    const guess = Date.UTC(y, mo, d, hh || 0, mm || 0, 0, 0);
    try { const t = new Date(guess);
      const asCT = new Date(t.toLocaleString("en-US", { timeZone: CT_ZONE }));
      const asUTC = new Date(t.toLocaleString("en-US", { timeZone: "UTC" }));
      return guess + (asUTC.getTime() - asCT.getTime());
    } catch (e) { return new Date(y, mo, d, hh || 0, mm || 0, 0, 0).getTime(); }
  }
  function tourStart() {   /* 0700 Central on day 1 of the AABBCC pair — same anchor/flip as the wall's tally */
    const n = ctNow(), s = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    if (n.getHours() < 7) s.setDate(s.getDate() - 1);
    const d = Math.floor((Date.UTC(s.getFullYear(), s.getMonth(), s.getDate()) - Date.UTC(2026, 0, 1)) / 86400000);
    if (((d % 6) + 6) % 6 % 2 !== 0) s.setDate(s.getDate() - 1);   /* odd index in AABBCC = day 2 -> step back to day 1 */
    return ctEpoch(s.getFullYear(), s.getMonth(), s.getDate(), 7, 0);
  }
  let tourAt = 0, tourBusy = false;
  function tourLoad() {
    if (!tourLayer || !map || !map.hasLayer(tourLayer)) return;   /* overlay off -> not even a fetch */
    if (tourBusy || Date.now() - tourAt < 4 * 60000) return;
    tourBusy = true;
    fetch(WORKER + "/calls?pin=" + encodeURIComponent(PIN)).then(r => r.ok ? r.json() : null).then(j => {
      tourBusy = false;
      if (!j || !j.ok) return;   /* enhancement layer — the dispatch loop owns loud auth/feed failures */
      tourAt = Date.now();
      const since = tourStart();
      tourLayer.clearLayers();
      (j.calls || []).forEach(c => {
        if (c.lat == null || c.lng == null) return;
        if (/GENERAL|BURNING|BURN BAN|HYDRANT|CAD OUTAGE|DISREGARD/i.test(String(c.type || ""))) return;
        const t = Date.parse(c.logged || c.started || ""); if (isNaN(t) || t < since) return;
        const col = callColor(c.type);
        let when = ""; try { when = new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", timeZone: CT_ZONE }); } catch (e) {}
        L.circleMarker([c.lat, c.lng], { pane: "tourPane", radius: 7, color: "#0D1117", weight: 2, opacity: .9,
            fillColor: col, fillOpacity: .92, className: "call-pin" })   /* wall's tour-pin look: dark outline, near-solid type fill */
          .bindTooltip(esc(c.type) + (when ? " · " + when : ""), { direction: "top", offset: [0, -8] }).addTo(tourLayer);
      });
    }).catch(() => { tourBusy = false; });
  }

  /* ── LOW-WATER CROSSINGS — same rules as the wall: closed/caution pin, offline only in storms ── */
  const cxIcon = L.icon({ iconUrl: "flood-marker.png", iconRetinaUrl: "flood-marker@2x.png", iconSize: [27, 34], iconAnchor: [13, 33] });
  const CX_WATCH = { "2311":1,"2325":1,"2322":1,"2321":1,"2308":1,"2561":1,"2580":1,"2377":1 };
  let stormNow = false;
  function cxPins() {
    fetch("https://api.bexarflood.org/api/sensors/GetAll").then(r => r.ok ? r.json() : null).then(j => {
      const arr = Array.isArray(j) ? j : []; if (!arr.length) return;
      cxLayer.clearLayers();
      arr.forEach(s => {
        if (!CX_WATCH[String(s.id)] || s.lat == null || s.lng == null) return;
        const st = +s.statusTypeID;
        if (st === 2) return;
        if (st === 3 && !stormNow) return;
        const lbl = st === 1 ? "CLOSED" : st === 4 ? "CAUTION" : "SENSOR OFFLINE — assume unsafe";
        L.marker([s.lat, s.lng], { icon: cxIcon, zIndexOffset: 500, keyboard: false })
          .bindTooltip(esc(s.title || "crossing") + " — " + lbl).addTo(cxLayer);
      });
    }).catch(() => {});
  }

  /* ── RADAR — auto-on during precip/wind warnings (same event-text rule as the wall) ── */
  const RF = ["nexrad-n0q-900913-m25m","nexrad-n0q-900913-m20m","nexrad-n0q-900913-m15m","nexrad-n0q-900913-m10m","nexrad-n0q-900913-m05m","nexrad-n0q-900913"];
  const rUrl = (id, bk) => "https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/" + id + "/{z}/{x}/{y}.png" + (bk ? "?_=" + bk : "");
  let rLayers = null, rAnim = null, rFi = RF.length - 1, rHold = 0, rBucket = 0, radarManual = false;
  function radarSync() { radarShow(stormNow || radarManual); }
  function radarShow(on) {
    if (!rLayers) rLayers = RF.map(id => L.tileLayer(rUrl(id), { pane: "radarPane", opacity: 0, maxZoom: 19, updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 2 }));
    if (on === radarOn) return; radarOn = on;
    rLayers.forEach(l => { try { on ? map.addLayer(l) : map.removeLayer(l); } catch (e) {} });
    if (on && !rAnim) { rFi = RF.length - 1; rAnim = setInterval(() => {
      if (rHold > 0) { rHold--; return; }
      rLayers[rFi].setOpacity(0); rFi = (rFi + 1) % RF.length; rLayers[rFi].setOpacity(0.5);
      if (rFi === RF.length - 1) rHold = 3;
      const bk = Math.floor(Date.now() / 300000);
      if (bk !== rBucket) { rBucket = bk; rLayers.forEach((l, i) => { try { l.setUrl(rUrl(RF[i], bk)); } catch (e) {} }); }
    }, 500); }
    else if (!on && rAnim) { clearInterval(rAnim); rAnim = null; }
  }

  /* ── WIND FLOW — the wall's windy-style particles: Open-Meteo 6x6 county model grid, IDW²
     steering, destination-out trail fade, zoom-scaled pacing. Manual overlay toggle. ── */
  let wcv = null, wctx = null, wparts = [], wraf = null, windManual = false;
  let windGrid = null, windGridAt = 0, windGridBusy = false;
  function fetchWindGrid() {
    if (windGridBusy || Date.now() - windGridAt < 15 * 60000) return;
    windGridBusy = true;
    const lats = [], lngs = [];
    for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) { lats.push((29.08 + r * 0.112).toFixed(3)); lngs.push((-98.93 + c * 0.132).toFixed(3)); }
    fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lats.join(",") + "&longitude=" + lngs.join(",") +
          "&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=mph")
      .then(r => r.ok ? r.json() : null).then(j => { windGridBusy = false;
        const arr = Array.isArray(j) ? j : (j ? [j] : []), g = [];
        arr.forEach(loc => { const c = loc && loc.current; if (!c || c.wind_direction_10m == null) return;
          g.push({ lat: loc.latitude, lng: loc.longitude, deg: +c.wind_direction_10m,
                   spd: (+c.wind_speed_10m || 0) + Math.max(0, ((+c.wind_gusts_10m || 0) - (+c.wind_speed_10m || 0)) * 0.3) }); });
        if (g.length >= 8) { windGrid = g; windGridAt = Date.now(); }
      }).catch(() => { windGridBusy = false; });
  }
  function wEnsure() { if (wcv) return;
    wcv = document.createElement("canvas");
    wcv.style.cssText = "position:absolute;left:0;top:0;pointer-events:none;z-index:650";   /* above the z-400 pane stack, below controls */
    map.getContainer().appendChild(wcv); wctx = wcv.getContext("2d"); }
  function wField(x, y) {
    if (!windGrid || !windGrid.length) return null;
    let ll; try { ll = map.containerPointToLatLng([x, y]); } catch (e) { return null; }
    let sx = 0, sy = 0, sw = 0;
    for (const w of windGrid) {
      const dd = Math.max(1e-6, (w.lat - ll.lat) * (w.lat - ll.lat) + (w.lng - ll.lng) * (w.lng - ll.lng));
      const wt = 1 / (dd * dd);
      const deg = (w.deg + 180) * Math.PI / 180;                /* met FROM -> flow TO */
      sx += wt * w.spd * Math.sin(deg); sy += wt * (-w.spd * Math.cos(deg)); sw += wt; }
    return { u: sx / sw, v: sy / sw };
  }
  const wSpawn = () => ({ x: Math.random() * wcv.width, y: Math.random() * wcv.height, life: 50 + Math.random() * 90 });
  function wStep() {
    wraf = null;
    if (!windManual) { if (wcv) { wctx.clearRect(0, 0, wcv.width, wcv.height); wcv.style.display = "none"; wparts = []; } return; }
    fetchWindGrid();
    wEnsure();
    const s = map.getSize(); if (wcv.width !== s.x || wcv.height !== s.y) { wcv.width = s.x; wcv.height = s.y; }
    wcv.style.display = "block";
    while (wparts.length < 300) wparts.push(wSpawn());
    wctx.globalCompositeOperation = "destination-out";          /* fade own alpha — a dark wash compounds to black */
    wctx.fillStyle = "rgba(0,0,0,0.08)"; wctx.fillRect(0, 0, wcv.width, wcv.height);
    wctx.globalCompositeOperation = "source-over";
    wctx.strokeStyle = "rgba(190,230,255,0.55)"; wctx.lineWidth = 1.1; wctx.beginPath();
    const kz = 0.028 * Math.min(3, Math.max(0.5, Math.pow(2, (map.getZoom() || 12) - 12)));
    for (let i = 0; i < wparts.length; i++) { const p = wparts[i];
      const f = wField(p.x, p.y); if (!f) { wparts[i] = wSpawn(); continue; }
      const nx = p.x + f.u * kz, ny = p.y + f.v * kz;
      wctx.moveTo(p.x, p.y); wctx.lineTo(nx, ny);
      p.x = nx; p.y = ny; p.life--;
      if (p.life <= 0 || nx < -4 || ny < -4 || nx > wcv.width + 4 || ny > wcv.height + 4) wparts[i] = wSpawn(); }
    wctx.stroke();
    wraf = requestAnimationFrame(wStep);
  }
  const wKick = () => { if (!wraf) wraf = requestAnimationFrame(wStep); };

  /* ── NWS ALERTS — direct api.weather.gov; chip + storm trigger for radar/crossings ── */
  function loadWx() {
    fetch("https://api.weather.gov/alerts/active?zone=TXZ205,TXC029", { headers: { "Accept": "application/geo+json" } })
      .then(r => r.ok ? r.json() : null).then(j => {
        const feats = (j && j.features) || [];
        const events = feats.map(f => (f.properties && f.properties.event) || "").filter(Boolean);
        stormNow = events.some(e => /TORNADO|THUNDER|FLOOD|SEVERE|STORM|HURRICANE|TROPICAL|HAIL|WIND/i.test(e));
        radarSync();
        const chip = $("wxChip");
        if (!events.length) { chip.style.display = "none"; return; }
        chip.style.display = "block";
        chip.className = "chip " + (events.some(e => /TORNADO|WARNING/i.test(e)) ? "bad" : "warn");
        chip.innerHTML = esc([...new Set(events)].slice(0, 3).join(" · "));
      }).catch(() => { /* wx chip is enhancement; dispatch banner is the loud one */ });
  }

  /* ── BOARD STATE — hospital diversions + officer OOS hydrants (public state doc, same as the wall) ── */
  let stateFails = 0;
  function loadState() {
    fetch(STATE_DOC).then(r => { if (!r.ok) throw 0; return r.json(); }).then(doc => {
      stateFails = 0;
      const dj = doc && doc.fields && doc.fields.stateJson && doc.fields.stateJson.stringValue;
      const st = dj ? JSON.parse(dj) : null;
      const chip = $("hospChip");
      if (!st) { chip.style.display = ""; chip.className = "chip bad"; chip.textContent = "DIVERSION STATUS UNKNOWN — verify via MEDCOM"; return; }
      const divs = st.diversions || [];
      /* all facilities open = say NOTHING — the cab screen stays clear. The chip only exists for
         diversions and for the fail-loud unknown state (silence must never mean "feed dead"). */
      if (!divs.length) { chip.style.display = "none"; }
      else { chip.style.display = ""; chip.className = "chip bad";
        chip.innerHTML = divs.length + " ON DIVERSION<span class='sub'>" + divs.slice(0, 4).map(d => esc(d.name) + " — " + esc(d.status)).join(" · ") + "</span>"; }
      const next = (st.oosHydrants || []).map(x => hydNorm(x && x.addr != null ? x.addr : x)).filter(Boolean);
      if (JSON.stringify(next) !== JSON.stringify(oosHyd)) { oosHyd = next; hydPainted = ""; hydUpdate(); oosRepaint(); }
    }).catch(() => {
      if (++stateFails >= 2) { const chip = $("hospChip"); chip.style.display = ""; chip.className = "chip bad"; chip.textContent = "DIVERSION STATUS UNKNOWN — verify via MEDCOM"; }
    });
  }

  /* ── DISPATCH — the reason this screen exists. Poll every 15 s; two consecutive failures =
     the loud red banner. New calls auto-focus the map once; District button reframes. ── */
  let dispatchFails = 0, knownIds = {}, focusId = null;
  const freshUntil = {};                             /* call id -> pulse expiry; the pin rebuild reads it each poll */
  function sonarDrop(c, col) {
    if (!freshLayer) return;
    const mk = L.marker([c.lat, c.lng], { interactive: false, keyboard: false,
      icon: L.divIcon({ className: "pin-sonar-wrap", iconSize: [0, 0],
        html: '<div class="pin-sonar" style="--sonar:' + col + '"><span></span><span></span></div>' }) }).addTo(freshLayer);
    setTimeout(() => { try { freshLayer.removeLayer(mk); } catch (e) {} }, 62000);   /* rings stop themselves at 30 cycles; this removes the DOM */
  }
  const isApp = (u) => /^[A-Za-z].*\d{3}$/.test(String(u));
  /* call-type palette — SAME colors as the wall's Runs by Type keypad, so the two screens speak
     one visual language. Order matters: ALARM/FIRE before MED so "ALARM - FIRE" classes purple. */
  /* general alerts / dispatcher broadcasts — one shared test: colors green, drops nav, ages out at 5 min */
  const GEN_RE = /GENERAL|BURNING|BURN BAN|HYDRANT|CAD OUTAGE|DISREGARD/i;
  function callColor(t) { t = String(t || "").toUpperCase();
    if (GEN_RE.test(t)) return "#3FB950";              /* broadcast, not a run — green, before any run class can claim it */
    if (/MVC|MVA|ACCIDENT|COLLISION|CRASH/.test(t)) return "#FF8C42";
    if (/ALARM/.test(t)) return "#A371F7";
    if (/FIRE|STRUCT|SMOKE|BRUSH|GRASS|WILDLAND/.test(t)) return "#F85149";
    if (/RESCUE/.test(t)) return "#FF7EB6";
    if (/\bHAZ/.test(t)) return "#3FB950";
    if (/GAS|FUEL|LEAK|SPILL|ODOR|FLUID/.test(t)) return "#2DD4BF";
    if (/ASSIST|LIFT|WELFARE|PUBLIC SERVICE|SERVICE CALL/.test(t)) return "#58A6FF";
    if (/MED|EMS|SICK|INJUR|BREATH|CARDIAC|CHEST|FALL|UNCONSCIOUS|STROKE|SEIZ|OVERDOSE|DIABET|ASSAULT|OB\b|HEADACHE|ALLERG|HEART/.test(t)) return "#FFC107";
    return "#8B949E"; }
  /* ── TENDER chip — the wall's live water-supply check, in the cab, now against the LOCAL
     hydrant db: a fire-class call with no plug within 1,000 ft gets the red TENDER OPS chip;
     an alarm-class call in the same gap gets the amber TENDER IF FIRE advisory. Synchronous
     scan of hydrants.json (48k rows, sub-ms) — db not loaded yet -> no chip, retried next poll. ── */
  const TD_KY = 110574, TD_KX = 96900;             /* m/deg at 29.4N — fine for a 305 m radius test */
  function hydWithin(lat, lng, m) {
    if (!HYDB) return null;
    const lim = m * m;
    for (const h of HYDB.h) {
      const dy = (h[2] - lat) * TD_KY, dx = (h[3] - lng) * TD_KX;
      if (dy * dy + dx * dx <= lim) return true;
    }
    return false;
  }
  const tenderCache = {};
  const tenderKey = (c) => c.cad_code || ("id:" + (c && c.id));
  function tenderClass(t) { t = String(t || "").toUpperCase();   /* wall's classify order: ALARM, then MVC (excluded), then FIRE */
    if (/ALARM/.test(t)) return "alarm";
    if (/MVC|MVA|ACCIDENT|COLLISION|CRASH/.test(t)) return "";
    if (/FIRE|STRUCT|SMOKE|BRUSH|GRASS|WILDLAND/.test(t)) return "fire";
    return ""; }
  function tenderCheck(c) {
    const k = tenderKey(c);
    if (k in tenderCache) return;
    const cls = tenderClass(c.type);
    if (!cls || c.lat == null || c.lng == null) { tenderCache[k] = null; return; }
    const near = hydWithin(c.lat, c.lng, 305);
    if (near == null) return;                      /* db still loading — retried next poll */
    tenderCache[k] = near ? null : (cls === "fire" ? "need" : "if");
  }
  function gmapsUrl(c) {
    if (c.lat != null && c.lng != null) return "https://www.google.com/maps/dir/?api=1&destination=" + c.lat + "," + c.lng;
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(String(c.address || "") + ", Bexar County, TX");
  }
  function amapsUrl(c) {
    if (c.lat != null && c.lng != null) return "https://maps.apple.com/?daddr=" + c.lat + "," + c.lng + "&dirflg=d";
    return "https://maps.apple.com/?daddr=" + encodeURIComponent(String(c.address || "") + ", Bexar County, TX") + "&dirflg=d";
  }
  function ageMin(c) { const t = Date.parse(c.logged || c.started || ""); return isNaN(t) ? 999 : (Date.now() - t) / 60000; }
  /* ── call band rendering. PHONE with two calls: only ONE card expands at a time — the other
     collapses to a slim colored bar (type + address); tapping the bar swaps which is expanded, so
     the map is never buried under two full cards on a pocket screen. Tablet/MDT show both full. */
  let lastTop = [], expandedId = null;
  const phoneMode = () => { try { return window.matchMedia("(max-width: 640px)").matches; } catch (e) { return false; } };
  function buildCard(c, slim) {
    const col = callColor(c.type);
    const attrs = ' data-id="' + esc(c.id) + '"' + (c.lat != null && c.lng != null ? ' data-ll="' + c.lat + "," + c.lng + '"' : "");
    /* dispatch stamp: logged = worker first-seen (trustworthy), started = A911's own. Central time
       always — the tour boundary rule applies to clocks too; a phone in another zone must not lie. */
    const ct = Date.parse(c.logged || c.started || "");
    let when = "", age = "";
    if (!isNaN(ct)) {
      try { when = new Date(ct).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: CT_ZONE }); } catch (e) {}
      const m = Math.round((Date.now() - ct) / 60000);
      age = m < 1 ? "now" : m + " min";
    }
    if (slim) return '<div class="ccard slim"' + attrs + ' style="border-color:' + col + '">' +
      '<span class="sty" style="color:' + col + '">' + esc(c.type) + "</span>" +
      '<span class="sad">' + esc(c.address) + "</span>" +
      (when ? '<span class="stime">' + when + "</span>" : "") + "</div>";
    const td = tenderCache[tenderKey(c)];
    return '<div class="ccard"' + attrs + ' style="border-color:' + col + '">' +
            '<div class="ty" style="color:' + col + '">' + esc(c.type) + '</div>' +
            '<div class="ad">' + esc(c.address) + '</div>' +
            (td === "need" ? '<div><span class="tdops">TENDER OPS</span></div>'
           : td === "if" ? '<div><span class="tdops if">TENDER IF FIRE</span></div>' : '') +
            ((when || c.cross) ? '<div class="meta">' +
              (when ? '<span><b>' + when + '</b> &middot; ' + age + '</span>' : "") +
              (c.cross ? '<span>X: ' + esc(c.cross) + "</span>" : "") + "</div>" : "") +
            (() => {                                       /* channel + assigned units get their OWN line, units as visible tags */
              const us = (c.units || []).filter(isApp).length ? (c.units || []).filter(isApp) : (c.units || []);
              const inner = (c.channel ? "<b>" + esc(c.channel) + "</b>" : "") + us.map(u => '<span class="utag' + (isApp(u) ? " app" : "") + '">' + esc(u) + "</span>").join("");   /* GREEN = a real rig attached (assigned or self-assigned) — trucks are rolling; gray box code = toned, no rig yet */
              return inner ? '<div class="uline">' + inner + "</div>" : "";
            })() +
            (GEN_RE.test(String(c.type || "")) ? "" :   /* a broadcast has no scene — nothing to navigate to */
            '<a class="navbtn" href="' + gmapsUrl(c) + '" target="_blank" rel="noopener"><span class="gbadge"><svg viewBox="0 0 48 48" width="13" height="13"><path fill="currentColor" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="currentColor" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="currentColor" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="currentColor" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span><span class="btxt">GOOGLE MAPS</span></a> ' +
            '<a class="navbtn apple" href="' + amapsUrl(c) + '" target="_blank" rel="noopener"><span class="alogo">&#63743;</span><span class="btxt">APPLE MAPS</span></a>') +
          "</div>";
  }

  function renderBand() {
    if (!lastTop.length) { $("callBand").innerHTML = '<div id="noCalls">NO ACTIVE CALLS · live</div>'; return; }
    if (!phoneMode() || lastTop.length === 1) { $("callBand").innerHTML = lastTop.map(c => buildCard(c, false)).join(""); return; }
    const exp = lastTop.find(c => c.id === expandedId) || lastTop[0];
    $("callBand").innerHTML = lastTop.map(c => buildCard(c, c.id !== exp.id)).join("");
  }
  try { window.matchMedia("(max-width: 640px)").addEventListener("change", renderBand); } catch (e) {}

  /* adaptive cadence: 6 s while a call is on the band — an attaching rig should go green in
     seconds, not at the bottom of a 15 s tick — 15 s idle so overnight costs stay where they were.
     Self-scheduling timeout, not setInterval, so the rate follows the band's state each cycle. */
  let dispTimer = null;
  function scheduleDispatch() { clearTimeout(dispTimer); dispTimer = setTimeout(loadDispatch, lastTop.length ? 6000 : 15000); }
  function loadDispatch() {
    fetch(WORKER + "/dispatch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: PIN }) })
      .then(r => { if (r.status === 401) { showGate("PIN expired — sign in again"); throw 0; } return r.json(); })
      .then(j => {
        if (!j || !j.ok) throw 0;
        dispatchFails = 0; $("feedDown").style.display = "none";
        /* general alerts / dispatcher broadcasts age out at 5 min — they are a heads-up, not a run,
           and the cab screen should not carry them as long as a working call (real calls keep 15) */
        const isGen = (c) => GEN_RE.test(String(c.type || ""));
        const live = (j.calls || []).filter(c => ageMin(c) <= (isGen(c) ? 5 : 15) && String(c.address || "").trim());
        /* call band: newest two */
        live.sort((a, b) => String(b.started).localeCompare(String(a.started)));
        lastTop = live.slice(0, 2);
        lastTop.forEach(tenderCheck);   /* async; a found flag repaints the band itself */
        renderBand();

        /* map pins + one-time focus per new call; a fresh call pulses and pings for ~60 s */
        callLayer.clearLayers();
        let newest = null;
        const nowMs = Date.now();
        live.forEach(c => {
          if (c.lat == null || c.lng == null) return;
          const col = callColor(c.type);
          if (!knownIds[c.id]) { knownIds[c.id] = 1; newest = c;
            freshUntil[c.id] = nowMs + 60000;
            sonarDrop(c, col);
          }
          /* the DASHBOARD's call-pin, verbatim: radius-7 circle, dark outline, near-solid type
             fill — one pin language across the wall and the cab. Fresh calls flash on top of it. */
          L.circleMarker([c.lat, c.lng], { radius: 7, color: "#0D1117", weight: 2, opacity: .9,
              fillColor: col, fillOpacity: .92,
              className: "call-pin" + ((freshUntil[c.id] || 0) > nowMs ? " pin-new" : "") })
            .bindTooltip(esc(c.type), { direction: "top", offset: [0, -8] }).addTo(callLayer);
        });
        if (newest && newest.id !== focusId) { focusId = newest.id;
          try { map.setView([newest.lat, newest.lng], 15.5); } catch (e) {} }
      })
      .then(() => scheduleDispatch())
      .catch(() => {
        if (++dispatchFails >= 2) $("feedDown").style.display = "block";   /* never a silent stale board */
        scheduleDispatch();
      });
  }

  /* ── DRONE PiP — live DroneSense video over the map corner when a bird is up ── */
  let pipHls = null, pipUrl = "";
  function loadDrones() {
    fetch(WORKER + "/drones?pin=" + encodeURIComponent(PIN)).then(r => r.ok ? r.json() : null).then(j => {
      const d = j && j.ok && (j.drones || []).find(x => x.video_url);
      const pip = $("dronePip"), v = $("droneVid");
      if (!d) { pip.style.display = "none";
        if (pipHls) { try { pipHls.destroy(); } catch (e) {} pipHls = null; }
        if (pipUrl) { try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) {} pipUrl = ""; }
        return; }
      pip.style.display = "block";
      $("droneLbl").textContent = (d.callSign || d.model || "UAS") + (d.mission ? " · " + d.mission : "");
      if (d.video_url !== pipUrl) {
        pipUrl = d.video_url;
        if (pipHls) { try { pipHls.destroy(); } catch (e) {} pipHls = null; }
        if (window.Hls && Hls.isSupported() && /\.m3u8/i.test(pipUrl)) {
          pipHls = new Hls({ liveDurationInfinity: true }); pipHls.loadSource(pipUrl); pipHls.attachMedia(v);
        } else v.src = pipUrl;
        v.play().catch(() => {});
      }
    }).catch(() => {});
  }

  /* tap a call card -> focus the map on that run (nav buttons keep their own click) */
  $("callBand").addEventListener("click", (e) => {
    if (e.target.closest(".navbtn")) return;
    const card = e.target.closest(".ccard");
    if (!card) return;
    if (card.classList.contains("slim")) { expandedId = card.dataset.id; renderBand(); }   /* tap a slim bar -> it becomes the expanded card */
    if (!card.dataset.ll || !map) return;
    const p = card.dataset.ll.split(",").map(Number);
    if (p.length === 2 && isFinite(p[0])) try { map.setView(p, 15.5); } catch (err) {}
  });

  /* PiP size cycle: corner -> half -> full -> corner */
  const PIP_SIZES = ["", "half", "full"];
  let pipSizeIdx = 0;
  $("pipSize").addEventListener("click", () => {
    pipSizeIdx = (pipSizeIdx + 1) % PIP_SIZES.length;
    $("dronePip").className = PIP_SIZES[pipSizeIdx];
    $("pipSize").innerHTML = pipSizeIdx === 2 ? "&#10529;" : "&#10530;";   /* ⤡ collapse hint at full */
  });

  /* ── boot ── */
  let booted = false;
  function boot() {
    if (booted) return; booted = true;
    initMap();
    loadDispatch();                                   /* self-schedules: 6 s with live calls, 15 s idle */
    document.addEventListener("visibilitychange", () => {   /* phone screen wakes -> current board NOW, not at the next tick */
      if (document.visibilityState === "visible" && !document.hidden) loadDispatch();
    });
    loadState(); setInterval(loadState, 15000);
    loadWx(); setInterval(loadWx, 10 * 60 * 1000);
    cxPins(); setInterval(cxPins, 5 * 60 * 1000);
    setInterval(tourLoad, 5 * 60 * 1000);   /* no-ops while the Tour Calls overlay is off; tourStart recomputed each pass so the 0700 reset lands */
    loadDrones(); setInterval(loadDrones, 20000);
  }
  if (PIN) { $("gate").style.display = "none"; boot(); }
  else setTimeout(() => $("pin").focus(), 60);
})();
</script>
</body>
</html>
